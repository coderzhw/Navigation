        <script>
            function getSearchText() {
                return document.getElementById("search-bar-input").value.trim();
            }

            function openSearch(engine) {
                var searchText = getSearchText();
                if (!searchText) {
                    document.getElementById("search-bar-input").focus();
                    return;
                }

                var searchUrlMap = {
                    baidu: "https://www.baidu.com/s?ie=UTF-8&wd=",
                    google: "https://www.google.com.hk/search?newwindow=1&hl=zh-CN&q="
                };

                window.open(searchUrlMap[engine] + encodeURIComponent(searchText), "_blank", "noopener");
            }

            function doBaiduSearch() {
                openSearch("baidu");
            }

            function doGoogleSearch() {
                openSearch("google");
            }

            document.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    doBaiduSearch();
                }
            });
        </script>
